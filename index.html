<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFCF6">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Saeyeon's Word Book</title>
<meta name="google" content="notranslate">
<meta name="description" content="Saeyeon's English word book with American pronunciation.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.92em' font-size='88'>🐣</text></svg>">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Wordbook">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="application-name" content="Wordbook">
<style>
  :root{
    --ink:#3F3548;
    --ink-soft:#6C5F72;
    --muted:#A296AB;
    --coral:#FF6F61;
    --mint:#2FB79C;
    --purple:#6C5CE7;
    --card:#FFFFFF;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  html{-webkit-text-size-adjust:100%;}
  body{
    min-height:100dvh;
    font-family:"Nunito","Baloo 2",-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Liberation Sans","Noto Sans CJK KR",system-ui,sans-serif;
    color:var(--ink);
    background:
      radial-gradient(circle at 8% -10%, #FFF3E0 0%, rgba(255,243,224,0) 40%),
      radial-gradient(circle at 100% 0%, #E8F5FF 0%, rgba(232,245,255,0) 42%),
      linear-gradient(180deg,#FFFCF5 0%,#F7FBFF 52%,#F8F4FF 100%);
    background-attachment:fixed;
    -webkit-tap-highlight-color:transparent;
  }
  /* quiet storybook sky: fixed, very faint, never moves */
  .scenery{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;}
  .scenery .cloud{fill:#FFFFFF;}
  .scenery .star{fill:#F2D98A;}
  .app{position:relative;z-index:1;max-width:480px;margin:0 auto;padding:16px 16px 44px;}

  /* ---------- header & pet growth ---------- */
  header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 4px 14px;}
  h1{font-size:21px;font-weight:900;letter-spacing:-.4px;margin:0;display:flex;align-items:center;gap:7px;color:#463B4E;}
  h1 .chick{font-size:24px;}
  .pet-badge{
    flex:0 0 auto;display:inline-flex;align-items:center;gap:8px;
    height:42px;padding:0 13px 0 10px;border-radius:21px;background:#FFF7E4;
    border:2px solid #F7DFB0;color:#6E5120;font:inherit;cursor:pointer;
    box-shadow:0 3px 10px rgba(180,140,60,.08);
  }
  .pet-badge:active{transform:translateY(1px);}
  .pet-em{font-size:23px;line-height:1;}
  .pet-meta{display:flex;flex-direction:column;align-items:flex-start;gap:3px;min-width:58px;}
  .pet-top{display:flex;align-items:center;justify-content:space-between;gap:6px;width:100%;font-size:12px;font-weight:900;line-height:1;}
  .pet-bar{width:100%;height:6px;border-radius:999px;background:#F3E2BD;overflow:hidden;}
  .pet-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,#FF9B71,#FF6F61);transition:width .3s ease;}

  .pet-modal{
    position:fixed;inset:0;z-index:40;background:rgba(48,38,58,.36);
    display:none;align-items:center;justify-content:center;padding:18px;
  }
  .pet-modal.open{display:flex;}
  .pet-sheet{
    width:100%;max-width:420px;max-height:82dvh;overflow-y:auto;background:#FFFDF9;border-radius:26px;padding:20px 18px 18px;
    border:2px solid #F2E8DA;box-shadow:0 18px 40px rgba(60,45,80,.18);
  }
  .pet-sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .pet-sheet-head h2{margin:0;font-size:18px;font-weight:900;color:var(--ink);}
  .pet-close{width:34px;height:34px;border:0;border-radius:50%;background:#F4EFF6;color:#7C6E85;font-size:16px;font-weight:900;cursor:pointer;}
  .pet-now{
    display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:18px;
    background:#FFF7E4;border:1.5px solid #F6E0B5;margin-bottom:14px;
  }
  .pet-now-em{font-size:40px;line-height:1;}
  .pet-now-info b{display:block;font-size:16px;font-weight:900;color:#5D4216;}
  .pet-now-info small{display:block;font-size:13px;font-weight:800;color:#8D6E35;margin-top:2px;}
  .pet-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
  .pet-node{
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    padding:9px 4px;border-radius:14px;border:1.5px solid #EFE8F3;background:#fff;
    text-align:center;
  }
  .pet-node.done{background:#F7FCF9;border-color:#CBEEDF;}
  .pet-node.cur{background:#FFF6DF;border-color:#F5CA7B;box-shadow:0 3px 10px rgba(220,170,60,.16);}
  .pet-node.lock{opacity:.48;background:#F7F5F9;}
  .pet-node .ne{font-size:24px;line-height:1;}
  .pet-node .nl{font-size:11px;font-weight:800;color:#5C4F64;line-height:1.1;}

  /* ---------- search ---------- */
  form.search{
    display:flex;align-items:center;gap:6px;
    background:var(--card);border:2px solid #F1E9E0;border-radius:28px;
    padding:5px 6px 5px 18px;
    box-shadow:0 6px 18px rgba(120,110,140,.08);
  }
  form.search:focus-within{border-color:#CFE6F5;box-shadow:0 8px 22px rgba(120,150,180,.14);}
  #q{
    flex:1;min-width:0;height:54px;border:0;outline:0;background:transparent;
    font:inherit;font-size:21px;font-weight:800;color:var(--ink);letter-spacing:-.2px;
  }
  #q::placeholder{color:#C6BBCE;font-weight:700;}
  .clear{
    flex:0 0 auto;width:42px;height:42px;border:0;border-radius:50%;
    background:#F4EFF6;color:#8E8099;font-size:17px;line-height:1;
    display:none;align-items:center;justify-content:center;
  }
  .clear.show{display:flex;}
  .go{
    flex:0 0 auto;width:56px;height:56px;border:0;border-radius:50%;
    background:linear-gradient(165deg,#FFA98C,#FF7161);color:#fff;font-size:23px;
    box-shadow:0 4px 0 #E9594B;display:flex;align-items:center;justify-content:center;
  }
  .go:active{transform:translateY(2px);box-shadow:0 2px 0 #E9594B;}

  /* ---------- picks ---------- */
  .picks{display:flex;gap:10px;overflow-x:auto;padding:14px 2px 6px;scrollbar-width:none;}
  .picks::-webkit-scrollbar{display:none;}
  .chip{
    flex:0 0 auto;display:inline-flex;align-items:center;gap:8px;
    min-height:56px;padding:0 18px;border:2px solid #F1E7DC;border-radius:28px;
    background:#fff;font:inherit;font-size:18px;font-weight:800;color:#504355;
    box-shadow:0 3px 0 #F2E9DF;cursor:pointer;
  }
  .chip .em{font-size:23px;line-height:1;}
  .chip:active{transform:translateY(2px);box-shadow:0 1px 0 #F2E9DF;}

  /* ---------- result ---------- */
  .result{margin-top:14px;}
  .card{
    position:relative;background:var(--card);border-radius:34px;padding:14px 16px 18px;
    box-shadow:0 12px 30px rgba(120,110,140,.12);
    animation:fade .2s ease-out;
  }
  .word{
    margin:6px 6px 2px;text-align:center;font-size:clamp(40px,13.6vw,60px);
    font-weight:900;letter-spacing:-1.4px;line-height:1.06;word-break:break-word;
  }
  .ipa{
    text-align:center;margin:0 0 14px;font-family:"Noto Sans","DejaVu Sans","Segoe UI",system-ui,sans-serif;
    font-size:clamp(25px,7.8vw,33px);font-weight:700;color:var(--purple);letter-spacing:.4px;
    word-break:break-word;
  }

  /* the little "from 👉 go" card */
  .from{
    display:flex;align-items:center;gap:8px;flex-wrap:wrap;
    margin:0 0 14px;padding:9px 12px;border-radius:20px;
    background:#FFFAEA;border:2px dashed #F1DFB0;
  }
  .from .lb{font-size:15px;font-weight:900;color:#A98A3F;letter-spacing:.02em;}
  .from .arrow{font-size:17px;}
  .from .base-word{
    border:0;background:#fff;padding:0 14px;height:46px;border-radius:15px;
    font:inherit;font-size:22px;font-weight:900;color:#3F3548;
    box-shadow:0 2px 0 #EADFC4;cursor:pointer;
  }
  .from .base-word:active{transform:translateY(2px);box-shadow:none;}
  .from .base-ipa{
    font-family:"Noto Sans","DejaVu Sans",sans-serif;font-size:19px;font-weight:700;color:var(--purple);
  }
  .from .mini{width:46px;height:46px;background:#FFEFC9;}

  /* picture hint: hidden until the child asks for it */
  .bottom{display:flex;align-items:center;gap:10px;margin-top:14px;}
  .hint-toggle{
    flex:1;height:58px;border:2px dashed #E4DAF0;border-radius:20px;background:#FBF8FE;
    color:#7B6B8B;font:inherit;font-size:16px;font-weight:900;letter-spacing:-.1px;
    display:flex;align-items:center;justify-content:center;gap:7px;
  }
  .hint-toggle:active{transform:translateY(2px);}
  .star{
    flex:0 0 auto;width:58px;height:58px;border:0;border-radius:20px;
    background:#FFF7EA;font-size:27px;line-height:1;display:flex;align-items:center;justify-content:center;
    box-shadow:0 3px 0 #F1E4D1;
  }
  .star.on{background:#FFF1BD;box-shadow:0 3px 0 #EFD778;}
  .star:active{transform:translateY(2px);box-shadow:none;}
  .hint{margin-top:12px;animation:fade .18s ease-out;}
  .hint-pic{
    height:120px;border-radius:20px;display:grid;place-items:center;overflow:hidden;
    background:linear-gradient(150deg,hsl(var(--h) 95% 96%),hsl(calc(var(--h) + 35) 90% 92%));
  }
  .hint-pic .big-emoji{font-size:64px;line-height:1;}

  .actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .btn{
    position:relative;height:72px;border:0;border-radius:24px;color:#fff;font:inherit;
    font-size:21px;font-weight:900;display:flex;align-items:center;justify-content:center;gap:8px;
    letter-spacing:-.2px;cursor:pointer;
  }
  .btn .ic{font-size:24px;line-height:1;}
  .listen{background:linear-gradient(165deg,#FFA98C,#FF7161);box-shadow:0 6px 0 #E9594B;}
  .slow{background:linear-gradient(165deg,#6ED9C3,#2FB79C);box-shadow:0 6px 0 #249A82;}
  .btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.16);}
  .btn.playing{box-shadow:inset 0 0 0 5px rgba(255,255,255,.45), 0 4px 0 rgba(0,0,0,.12);}
  .ex{
    display:flex;align-items:center;gap:10px;margin-top:10px;padding:9px 12px 9px 9px;
    background:#FBF7FF;border-radius:20px;
  }
  .ex p{margin:0;font-size:17px;font-weight:700;color:var(--ink-soft);line-height:1.35;}
  .mini{
    flex:0 0 auto;width:46px;height:46px;border:0;border-radius:50%;background:#EFE7FA;
    font-size:20px;display:flex;align-items:center;justify-content:center;
  }
  .mini:active{transform:scale(.95);}
  .tag{
    margin:12px auto 0;width:max-content;padding:5px 12px;border-radius:999px;
    background:#F1EEF6;color:#9C90A6;font-size:12px;font-weight:800;letter-spacing:.04em;
  }
  .sparkle{
    position:absolute;left:50%;top:6px;font-size:20px;pointer-events:none;
    animation:rise .7s ease-out forwards;
  }

  /* ---------- message card ---------- */
  .msg{
    background:var(--card);border-radius:34px;padding:32px 22px 28px;text-align:center;
    box-shadow:0 12px 30px rgba(120,110,140,.1);animation:fade .2s ease-out;
  }
  .msg .face{font-size:74px;line-height:1;display:block;margin-bottom:12px;}
  .msg b{display:block;font-size:24px;font-weight:900;letter-spacing:-.4px;}
  .msg small{display:block;margin-top:8px;font-size:16px;font-weight:700;color:var(--muted);line-height:1.4;}
  .msg .retry{
    margin-top:18px;height:56px;padding:0 26px;border:0;border-radius:22px;
    background:linear-gradient(165deg,#6ED9C3,#2FB79C);color:#fff;font:inherit;font-size:19px;font-weight:900;
    box-shadow:0 5px 0 #249A82;
  }
  .msg .retry:active{transform:translateY(3px);box-shadow:0 2px 0 #249A82;}

  /* ---------- shelves ---------- */
  .shelf{margin-top:18px;}
  .shelf-head{display:flex;align-items:center;justify-content:space-between;margin:0 6px 8px;}
  .shelf-head h3{margin:0;font-size:14px;font-weight:900;color:#A092A9;letter-spacing:.02em;}
  .shelf-head button{border:0;background:transparent;color:#BBAEC2;font:inherit;font-size:13px;font-weight:800;padding:4px 2px;}
  .row{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 4px;scrollbar-width:none;}
  .row::-webkit-scrollbar{display:none;}
  .pill{
    flex:0 0 auto;display:inline-flex;align-items:center;gap:7px;height:46px;padding:0 15px;
    border:2px solid #EEE8F4;border-radius:23px;background:#fff;font:inherit;
    font-size:16px;font-weight:800;color:#5C4F64;cursor:pointer;
  }
  .pill .em{font-size:19px;line-height:1;}
  .pill:active{transform:translateY(2px);}

  /* ---------- tablet / wide layout: right-side history ---------- */
  .main-col{min-width:0;}
  .recent-empty{font-size:14px;font-weight:700;color:var(--muted);padding:10px 6px;margin:0;}
  @media (min-width:680px){
    .app{
      max-width:860px;padding:20px 24px 48px;
      display:grid;grid-template-columns:minmax(0,1fr) 244px;gap:22px;align-items:start;
    }
    .shelf-recent{
      margin-top:0;position:sticky;top:18px;
      background:rgba(255,255,255,.88);border:2px solid #F1E9E0;border-radius:24px;
      padding:14px 12px;max-height:calc(100dvh - 44px);overflow-y:auto;
      box-shadow:0 8px 22px rgba(120,110,140,.06);
    }
    .shelf-recent[hidden]{display:block!important;}
    .shelf-recent .row{flex-direction:column;overflow-x:visible;gap:7px;padding:2px 0;}
    .shelf-recent .pill{
      width:100%;justify-content:space-between;height:auto;min-height:44px;
      padding:8px 13px;border-radius:16px;
    }
    .shelf-recent .pill .p-left{display:inline-flex;align-items:center;gap:7px;min-width:0;}
    .shelf-recent .pill .p-w{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .shelf-recent .pill .p-ipa{font-size:13px;font-weight:700;color:var(--muted);flex:0 0 auto;}
  }

  /* ---------- star stamp & toast ---------- */
  .stamp{
    position:fixed;top:76px;left:50%;z-index:30;pointer-events:none;
    transform:translate(-50%,-8px) scale(.92);opacity:0;
    padding:10px 20px;border-radius:999px;background:#FFF4C9;color:#7C5B14;
    font-size:17px;font-weight:900;box-shadow:0 10px 22px rgba(190,150,60,.22);
    transition:opacity .18s ease,transform .18s ease;
  }
  .stamp.in{opacity:1;transform:translate(-50%,0) scale(1);}
  .toast{
    position:fixed;left:50%;bottom:26px;transform:translate(-50%,18px);
    background:#3F3548;color:#fff;padding:11px 20px;border-radius:999px;
    font-size:15px;font-weight:800;opacity:0;pointer-events:none;transition:.22s;z-index:20;
  }
  .toast.show{opacity:1;transform:translate(-50%,0);}

  @keyframes fade{from{opacity:0;}to{opacity:1;}}
  @keyframes rise{from{opacity:1;transform:translate(-50%,0) scale(.8);}to{opacity:0;transform:translate(-50%,-26px) scale(1.15);}}
  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important;}
  }
</style>
</head>
<body>

<svg class="scenery" viewBox="0 0 400 800" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <g class="cloud" opacity="0.75">
    <ellipse cx="66" cy="120" rx="46" ry="21"/>
    <ellipse cx="98" cy="128" rx="32" ry="15"/>
    <ellipse cx="36" cy="129" rx="26" ry="12"/>
  </g>
  <g class="cloud" opacity="0.55">
    <ellipse cx="336" cy="252" rx="38" ry="17"/>
    <ellipse cx="360" cy="259" rx="26" ry="12"/>
  </g>
  <g class="cloud" opacity="0.6">
    <ellipse cx="120" cy="560" rx="52" ry="23"/>
    <ellipse cx="158" cy="568" rx="34" ry="15"/>
    <ellipse cx="86" cy="569" rx="30" ry="13"/>
  </g>
  <g class="cloud" opacity="0.5">
    <ellipse cx="330" cy="700" rx="44" ry="20"/>
    <ellipse cx="300" cy="707" rx="26" ry="12"/>
  </g>
  <g class="star" opacity="0.55">
    <path d="M300 90 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3z"/>
    <path d="M110 230 l2.4 5.6 5.6 2.4 -5.6 2.4 -2.4 5.6 -2.4 -5.6 -5.6 -2.4 5.6 -2.4z"/>
    <path d="M232 400 l2 4.7 4.7 2 -4.7 2 -2 4.7 -2 -4.7 -4.7 -2 4.7 -2z"/>
    <path d="M60 470 l2.4 5.6 5.6 2.4 -5.6 2.4 -2.4 5.6 -2.4 -5.6 -5.6 -2.4 5.6 -2.4z"/>
    <path d="M368 430 l2 4.7 4.7 2 -4.7 2 -2 4.7 -2 -4.7 -4.7 -2 4.7 -2z"/>
    <path d="M200 640 l2.4 5.6 5.6 2.4 -5.6 2.4 -2.4 5.6 -2.4 -5.6 -5.6 -2.4 5.6 -2.4z"/>
    <path d="M330 330 l2 4.7 4.7 2 -4.7 2 -2 4.7 -2 -4.7 -4.7 -2 4.7 -2z"/>
  </g>
</svg>

<div class="app">
  <div class="main-col">
    <header>
      <h1>Saeyeon's Word Book <span class="chick">🐣</span></h1>
      <button type="button" class="pet-badge" id="petBadge" aria-label="My Pet Growth">
        <span class="pet-em" id="petEm">🥚</span>
        <span class="pet-meta">
          <span class="pet-top"><span id="petName">Egg</span><span id="petProg">0/3</span></span>
          <span class="pet-bar"><span class="pet-fill" id="petFill" style="width:0%"></span></span>
        </span>
      </button>
    </header>

    <form class="search" id="searchForm" role="search" autocomplete="off">
      <input id="q" type="text" name="q" placeholder="Type a word" inputmode="search"
             enterkeyhint="search" autocapitalize="none" autocorrect="off" spellcheck="false"
             aria-label="Type a word">
      <button class="clear" id="clearBtn" type="button" aria-label="Clear">✕</button>
      <button class="go" type="submit" aria-label="Search">🔍</button>
    </form>

    <div class="result" id="result"></div>

    <section class="shelf" id="shelfSaved" hidden>
      <div class="shelf-head"><h3>⭐ My words</h3></div>
      <div class="row" id="rowSaved"></div>
    </section>
  </div>

  <section class="shelf shelf-recent" id="shelfRecent" hidden>
    <div class="shelf-head"><h3>🕒 History</h3><button type="button" id="clearRecent">clear</button></div>
    <div class="row" id="rowRecent"></div>
  </section>
</div>

<div class="stamp" id="stamp" aria-live="polite"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="pet-modal" id="petModal" role="dialog" aria-modal="true" aria-labelledby="petModalTitle">
  <div class="pet-sheet">
    <div class="pet-sheet-head">
      <h2 id="petModalTitle">🩺 Vet Saeyeon's Pets</h2>
      <button type="button" class="pet-close" id="petClose" aria-label="Close">✕</button>
    </div>
    <div class="pet-now" id="petNow"></div>
    <div class="pet-grid" id="petGrid"></div>
  </div>
</div>

<script>
/* =====================================================================
   Saeyeon's Word Book — one file, no build, works in a phone browser.
   Big picture + big word + US IPA + Listen / Slow.
   No Korean meanings: the picture is the meaning.
   Past / plural forms find their base word ("from 👉 go").
   ===================================================================== */

/* ---------- local picture dictionary ---------- */
const LOCAL = [
  /* animals */
  {w:'dog',        ipa:'/dɑːɡ/',            e:'🐶', ex:'My dog is very cute.'},
  {w:'cat',        ipa:'/kæt/',             e:'🐱', ex:'The cat is sleeping.'},
  {w:'bird',       ipa:'/bɝːd/',            e:'🐦', ex:'A bird can fly.'},
  {w:'fish',       ipa:'/fɪʃ/',             e:'🐟', ex:'Fish live in water.'},
  {w:'rabbit',     ipa:'/ˈræb.ɪt/',         e:'🐰', ex:'The rabbit has long ears.'},
  {w:'tiger',      ipa:'/ˈtaɪ.ɡɚ/',         e:'🐯', ex:'A tiger is big and strong.'},
  {w:'lion',       ipa:'/ˈlaɪ.ən/',         e:'🦁', ex:'The lion is sleeping.'},
  {w:'monkey',     ipa:'/ˈmʌŋ.ki/',         e:'🐵', ex:'Monkeys like bananas.'},
  {w:'bear',       ipa:'/ber/',             e:'🐻', ex:'The bear is very big.'},
  {w:'elephant',   ipa:'/ˈel.ə.fənt/',      e:'🐘', ex:'An elephant has a long nose.'},

function petState(n){
  let idx = 0;
  for (let i = 0; i < PET_STAGES.length; i++) {
    if (n >= PET_STAGES[i].min) idx = i;
  }
  const cur = PET_STAGES[idx];
  const next = PET_STAGES[idx + 1] || null;
  if (!next) {
    const step = (n - cur.min) % 10;
    return {idx, cur, next: null, have: step, need: 10, pct: (step / 10) * 100};
  }
  const span = next.min - cur.min;
  const have = n - cur.min;
  return {idx, cur, next, have, need: span, pct: Math.min(100, Math.round((have / span) * 100))};
}

  if (pet.words.indexOf(w) > -1) return {added: false, evolved: false};

function refreshVoices(){ try { voices = synth ? (synth.getVoices() || []) : []; } catch (e) { voices = []; } }
if (synth) {
  refreshVoices();
  if (synth.addEventListener) synth.addEventListener('voiceschanged', refreshVoices);
  else synth.onvoiceschanged = refreshVoices;

function pickVoice(){
  const en = voices.filter(v => /^en([-_]|$)/i.test(v.lang || ''));
  return en.find(v => /en[-_]US/i.test(v.lang) && /google|samantha|aria|jenny|natural|female/i.test(v.name))
      || en.find(v => /en[-_]US/i.test(v.lang))
      || en.find(v => /en[-_]GB/i.test(v.lang))
      || en[0] || null;
}
const audioEls = new Map();
function playAudio(url, rate){
  return new Promise((resolve, reject) => {
    let a = audioEls.get(url);
    if (!a) { a = new Audio(); a.preload = 'auto'; a.src = url; audioEls.set(url, a); }
    try { a.pause(); a.currentTime = 0; } catch (e) {}
    a.preservesPitch = true; a.mozPreservesPitch = true; a.webkitPreservesPitch = true;
    a.playbackRate = rate;
    let done = false;
    const finish = ok => { if (done) return; done = true; a.onended = null; a.onerror = null; clearTimeout(timer); ok ? resolve() : reject(new Error('audio-failed')); };
    const timer = setTimeout(() => finish(a.currentTime > 0 && !a.paused), 4500);
    a.onended = () => finish(true);
    a.onerror = () => finish(false);
    const p = a.play();
    if (p && p.then) p.catch(() => finish(false));
  });
}
function tts(text, rate){
  if (!synth || !window.SpeechSynthesisUtterance) return false;
  try { synth.cancel(); } catch (e) {}
  const u = new SpeechSynthesisUtterance(String(text));
  u.lang = 'en-US'; u.rate = rate; u.pitch = 1.04; u.volume = 1;
  const v = pickVoice();
  if (v) { try { u.voice = v; } catch (e) {} }
  try { synth.speak(u); } catch (e) { return false; }
  return true;
}
function stopSound(){
  if (synth) { try { synth.cancel(); } catch (e) {} }
  audioEls.forEach(a => { try { a.pause(); } catch (e) {} });
}
let playToken = 0;
async function say(text, slow, opts = {}){
  if (!text) return;
  const token = ++playToken;
  stopSound();
  const url = opts.audio || (current && current.audio);
  if (url && !opts.ttsOnly) {
    try { await playAudio(url, slow ? 0.62 : 1); return; }
    catch (e) { /* no mp3 or blocked: use the voice */ }
    if (token !== playToken) return;
  }
  if (!tts(text, slow ? 0.6 : 0.92)) toast('No sound 😢');
}

function guessIcon(text, extra){

  for (const [re, icon] of ICON_RULES) if (word && re.test(word)) return icon;

  return '✨';

/* ---------- dictionary API ---------- */
function tidyIpa(s){
  if (!s) return '';
  let t = String(s).trim();
  if (/^\[.*\]$/.test(t)) t = '/' + t.slice(1, -1) + '/';
  /* dictionary transcriptions carry tiny diacritics a child cannot read */
  t = t.normalize('NFD').replace(/[\u0300-\u036f]/g, '').normalize('NFC');
  t = t.replace(/ʷ/g, '');
  t = t.replace(/əɹ/g, 'ɚ').replace(/ɜːɹ/g, 'ɝː').replace(/ɜɹ/g, 'ɝ');
  t = t.replace(/\s+/g, '');
  return t;
}
function parseApi(data, word){
  if (!Array.isArray(data) || !data.length) return null;
  const ipas = [], audios = [], defs = [];
  data.forEach(entry => {
    (entry.phonetics || []).forEach(p => {
      const a = (p.audio || '').trim();
      if (a) audios.push(a);
      if (p.text) ipas.push({text: p.text, audio: a});
    });
    if (entry.phonetic) ipas.push({text: entry.phonetic, audio: ''});
    (entry.meanings || []).forEach(m => {
      (m.definitions || []).forEach(d => {
        if (d.definition) defs.push(d.definition);
        if (d.example) defs.push(d.example);
      });
    });
  });
  const usAudio = audios.find(a => /-us\.mp3/i.test(a)) || audios.find(a => /en[-_]us/i.test(a)) || '';
  /* choose the clearest transcription: slash notation and a US reading first */
  const ranked = ipas.filter(x => x.text).map(x => ({
    t: x.text,
    score: (/^\//.test(x.text.trim()) ? 2 : 0) + (/-us/i.test(x.audio || '') ? 2 : 0) - (/[\u0300-\u036f]/.test(x.text) ? 1 : 0)
  })).sort((a, b) => b.score - a.score);
  const withUs = ranked.length ? ranked[0] : null;
  return {
    w: String(data[0].word || word).toLowerCase(),
    ipa: tidyIpa(withUs ? withUs.t : ''),
    audio: usAudio,
    e: guessIcon(defs.join(' '), data[0].word || word)
  };
}
async function fetchEntry(word, ms){
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), ms || 8000);
  let res;
  try {
    res = await fetch('https://api.dictionaryapi.dev/api/v2/entries/en/' + encodeURIComponent(word), {signal: ctrl.signal, mode: 'cors'});
  } finally { clearTimeout(timer); }
  if (res.status === 404) return null;
  if (!res.ok) throw new Error('http ' + res.status);
  const data = await res.json();
  return parseApi(data, word);
}

/* ---------- base form of a changed word ---------- */
function regularCandidates(w){
  const out = [];
  const add = c => { if (c && c.length >= 2 && c !== w && out.indexOf(c) < 0) out.push(c); };
  if (w.length >= 5 && w.endsWith('ied')) add(w.slice(0, -3) + 'y');
  if (w.length >= 4 && w.endsWith('ies')) add(w.slice(0, -3) + 'y');
  if (w.length >= 4 && w.endsWith('ed')) {
    const stem = w.slice(0, -2);
    add(stem);
    if (stem.length >= 3 && stem[stem.length - 1] === stem[stem.length - 2]) add(stem.slice(0, -1));
    add(w.slice(0, -1));
  }
  if (w.length >= 5 && w.endsWith('ing')) {
    const stem = w.slice(0, -3);
    if (stem.length >= 3 && stem[stem.length - 1] === stem[stem.length - 2]) add(stem.slice(0, -1));
    add(stem);
    add(stem + 'e');
  }
  if (w.length >= 3 && w.endsWith('es')) add(w.slice(0, -2));
  if (w.length >= 3 && w.endsWith('s') && !/(ss|us|is)$/.test(w)) add(w.slice(0, -1));
  return out;
}
function localData(word){
  const l = LOCAL_MAP.get(word);
  if (l) return {w: l.w, ipa: l.ipa, e: l.e, ex: l.ex, audio: ''};
  const c = cache[word];
  if (c) return {w: c.w || word, ipa: c.ipa || '', e: c.e || '✨', ex: '', audio: c.audio || ''};
  const s = saved.find(x => x.w === word);
  if (s) return {w: s.w, ipa: s.ipa || '', e: s.e || '✨', ex: s.ex || '', audio: s.audio || ''};
  return null;
}
async function resolveBase(w){
  if (LOCAL_MAP.has(w)) return null;                 /* it is already a base word */
  const ir = IRREGULAR[w];
  if (ir && ir !== w) {
    const known = localData(ir);
    if (known) return known;
    try { const api = await fetchEntry(ir, 6000); if (api) { remember(ir, api); return api; } } catch (e) {}
    return {w: ir, ipa: '', e: '✨', ex: '', audio: ''};
  }
  if (NOT_A_FORM.has(w)) return null;
  const cands = regularCandidates(w);
  if (!cands.length) return null;
  for (const c of cands) {
    const d = localData(c);
    if (d) return d;
  }
  for (const c of cands.slice(0, 2)) {
    try {
      const api = await fetchEntry(c, 5000);
      if (api) { remember(c, api); return api; }
    } catch (e) {}
  }
  return null;
}
function remember(word, api){
  cache[word] = {w: word, ipa: api.ipa || '', audio: api.audio || '', e: api.e || '✨'};
  saveCache();
}

    '</div>' : '';
  const hint =
    '<div class="hint" id="hint"' + (hintOpen ? '' : ' hidden') + '>' +
      '<div class="hint-pic"><span class="big-emoji">' + entry.e + '</span></div>' +
      (entry.ex ? '<div class="ex"><button class="mini" id="btnEx" type="button" aria-label="Play the sentence">🔊</button><p>' + esc(entry.ex) + '</p></div>' : '') +
    '</div>';
  resultEl.innerHTML =
    '<article class="card" style="--h:' + hue(entry.w) + '">' +
      '<h2 class="word">' + esc(entry.w) + '</h2>' +
      '<div class="ipa">' + esc(entry.ipa || '—') + '</div>' +
      fromBadge +
      '<div class="actions">' +
        '<button class="btn listen" id="btnListen" type="button"><span class="ic">🔊</span> Listen</button>' +
        '<button class="btn slow" id="btnSlow" type="button"><span class="ic">🐢</span> Slow</button>' +
      '</div>' +
      '<div class="bottom">' +
        '<button class="hint-toggle" id="hintBtn" type="button">' + (hintOpen ? '🙈 Hide hint' : '👀 Picture Hint') + '</button>' +
        '<button class="star' + (on ? ' on' : '') + '" id="starBtn" type="button" aria-label="Save word">' + (on ? '⭐' : '☆') + '</button>' +
      '</div>' +
      hint +
      (opts.offline ? '<div class="tag">offline</div>' : '') +
    '</article>';

  $('#starBtn').addEventListener('click', toggleSave);
  const bl = $('#btnListen'), bs = $('#btnSlow');
  bl.addEventListener('click', () => { mark(bl); sparkle(bl); say(entry.w, false); });
  bs.addEventListener('click', () => { mark(bs); sparkle(bs); say(entry.w, true); });
  $('#hintBtn').addEventListener('click', () => {
    hintOpen = !hintOpen;
    $('#hint').hidden = !hintOpen;
    $('#hintBtn').textContent = hintOpen ? '🙈 Hide hint' : '👀 Picture Hint';
  });
  const be = $('#btnEx');
  if (be) be.addEventListener('click', () => say(entry.ex, false, {ttsOnly: true, audio: ''}));
  const bw = $('#baseBtn');
  if (bw) bw.addEventListener('click', () => { if (inputEl.blur) inputEl.blur(); show(base.w); });
  const bsay = $('#baseSay');
  if (bsay) bsay.addEventListener('click', () => say(base.w, false, {audio: base.audio || '', ttsOnly: !base.audio}));
}
function mark(btn){
  document.querySelectorAll('.btn.playing').forEach(b => b.classList.remove('playing'));
  btn.classList.add('playing');
  setTimeout(() => btn.classList.remove('playing'), 2200);
}
function sparkle(btn){
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const s = document.createElement('span');
  s.className = 'sparkle';
  s.textContent = '✨';
  btn.appendChild(s);
  setTimeout(() => s.remove(), 750);
}
function paintMessage(kind, word){
  current = null;
  const map = {
    welcome:  {face: '🐣', title: 'Type a word!',     note: 'Type a word from your book.'},
    thinking: {face: '🐥', title: 'Looking…',         note: ''},
    letters:  {face: '🙈', title: 'English letters!', note: 'Type the word in English letters.'},
    notfound: {face: '🙈', title: 'Oops, not found',  note: 'Let’s check the spelling once more.'},
    offline:  {face: '📴', title: 'No internet',      note: 'Try again in a moment.'}
  };
  const m = map[kind] || map.welcome;
  resultEl.innerHTML =
    '<div class="msg">' +
      '<span class="face">' + m.face + '</span>' +
      '<b>' + esc(m.title) + '</b>' +
      (word ? '<small>“' + esc(word) + '”</small>' : '') +
      (m.note ? '<small>' + esc(m.note) + '</small>' : '') +
      (kind === 'offline' ? '<button class="retry" type="button" id="retryBtn">Try again</button>' : '') +
    '</div>';
  const r = $('#retryBtn');
  if (r) r.addEventListener('click', () => { if (lastWord) show(lastWord); });
}

/* ---------- the search ---------- */
async function show(raw){
  const w = norm(raw);
  if (!w) { paintMessage('welcome'); return; }
  lastWord = w;
  inputEl.value = String(raw).trim();
  refreshClear();
  if (!/^[a-z' .\-]+$/.test(w)) { paintMessage('letters', String(raw).trim()); return; }
  if (w.length > 40) { paintMessage('notfound', w); return; }

  const mine = ++seq;
  hintOpen = false;
  const local = LOCAL_MAP.get(w);
  const quick = localData(w);

  if (quick) paintCard(quick);
  else paintMessage('thinking');
  addRecent(w);
  if (quick) { const res = addPetWord(w); if (res.added) praise(res); }

  /* a phrase from the picture book needs no online lookup */
  if (local && w.indexOf(' ') > -1) return;

  let api = null, failed = false;
  const baseP = resolveBase(w).catch(() => null);
  try { api = await fetchEntry(w); } catch (e) { failed = true; }
  const base = await baseP;
  if (mine !== seq) return;

  if (!api) {
    if (quick) {
      paintCard(Object.assign({}, quick, {e: (base && base.e) || quick.e, ex: (base && base.ex) || quick.ex}), {base: base, offline: failed});
    } else if (base) {
      paintCard({w: w, ipa: '', e: base.e || '✨', ex: base.ex || '', audio: ''}, {base: base, offline: failed});
    } else {
      paintMessage(failed ? 'offline' : 'notfound', w);
    }
    return;
  }

  remember(w, api);
  if (base && base.e) { cache[w].e = base.e; saveCache(); }
  renderRecent();
  paintCard({
    w: w,
    ipa: (local && local.ipa) || (quick && quick.ipa) || api.ipa || '',
    e: (base && base.e) || (local && local.e) || (quick && quick.e) || api.e || '✨',
    ex: (base && base.ex) || (quick && quick.ex) || '',
    audio: api.audio || (quick && quick.audio) || ''
  }, {base: base});
  if (!quick) { const res = addPetWord(w); if (res.added) praise(res); }
}

/* ---------- praise stamp ---------- */
let stampTimer = null;
function praise(res){
  const el = $('#stamp');
  el.textContent = res.evolved
    ? ('🎉 New Friend! ' + res.stage.e + ' ' + res.stage.name + '!')
    : (res.stage.e + ' +1 · ' + res.prog);
  el.classList.add('in');
  clearTimeout(stampTimer);
  stampTimer = setTimeout(() => el.classList.remove('in'), res.evolved ? 2000 : 1200);
}

/* ---------- saved & recent ---------- */
function addRecent(w){
  recent = [w].concat(recent.filter(x => x !== w)).slice(0, 30);
  writeJSON('sw.recent.v1', recent);
  renderRecent();
}
function toggleSave(){
  if (!current) return;
  const w = current.w;
  if (isSaved(w)) {
    saved = saved.filter(s => s.w !== w);
    toast('Removed');
  } else {
    saved = [{w: w, ipa: current.ipa || '', e: current.e || '✨', ex: current.ex || '', audio: current.audio || ''}]
      .concat(saved.filter(s => s.w !== w)).slice(0, 40);
    toast('Saved ⭐');
  }
  writeJSON('sw.saved.v1', saved);
  const on = isSaved(w);
  const star = $('#starBtn');
  if (star) { star.textContent = on ? '⭐' : '☆'; star.classList.toggle('on', on); }
  renderSaved();
}
function saveCache(){
  const keys = Object.keys(cache);
  if (keys.length > 300) keys.slice(0, keys.length - 300).forEach(k => delete cache[k]);
  writeJSON('sw.cache.v1', cache);
}
function chip(word, em){
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'pill';
  b.innerHTML = '<span class="em">' + em + '</span>' + esc(word);
  b.addEventListener('click', () => { if (inputEl.blur) inputEl.blur(); show(word); });
  return b;
}
function renderSaved(){
  const box = $('#shelfSaved'), row = $('#rowSaved');
  row.innerHTML = '';
  saved.forEach(s => row.appendChild(chip(s.w, s.e || emojiFor(s.w))));
  box.hidden = saved.length === 0;
}
function renderRecent(){
  const box = $('#shelfRecent'), row = $('#rowRecent');
  row.innerHTML = '';
  if (recent.length === 0) {
    const p = document.createElement('p');
    p.className = 'recent-empty';
    p.textContent = 'Words you search will stay here.';
    row.appendChild(p);
    box.hidden = true;
    return;
  }
  recent.forEach(w => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'pill';
    const d = LOCAL_MAP.get(w) || cache[w];
    const ipa = (d && d.ipa) ? d.ipa : '';
    b.innerHTML = '<span class="p-left"><span class="p-w">' + esc(w) + '</span></span>' +
                  (ipa ? '<span class="p-ipa">' + esc(ipa) + '</span>' : '');
    b.addEventListener('click', () => { inputEl.value = w; refreshClear(); show(w); });
    row.appendChild(b);
  });
  box.hidden = false;
}

/* ---------- toast ---------- */
let toastTimer = null;
function toast(msg){
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1500);
}

/* ---------- wiring ---------- */
$('#searchForm').addEventListener('submit', e => {
  e.preventDefault();
  const v = inputEl.value;
  if (inputEl.blur) inputEl.blur();
  show(v);
});
inputEl.addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); if (inputEl.blur) inputEl.blur(); show(inputEl.value); }
});
function refreshClear(){ $('#clearBtn').classList.toggle('show', inputEl.value.length > 0); }
inputEl.addEventListener('input', refreshClear);
$('#clearBtn').addEventListener('click', () => { inputEl.value = ''; refreshClear(); inputEl.focus(); });
$('#clearRecent').addEventListener('click', () => { recent = []; writeJSON('sw.recent.v1', []); renderRecent(); });

document.addEventListener('visibilitychange', () => { if (document.hidden) stopSound(); });
window.addEventListener('pagehide', stopSound);
window.addEventListener('error', e => { try { console.warn('page error', e.message); } catch (err) {} });

$('#petBadge').addEventListener('click', openPetModal);
$('#petClose').addEventListener('click', () => $('#petModal').classList.remove('open'));
$('#petModal').addEventListener('click', e => { if (e.target.id === 'petModal') $('#petModal').classList.remove('open'); });

renderPet();
renderSaved();
renderRecent();
paintMessage('welcome');
refreshClear();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
